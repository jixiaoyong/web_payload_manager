name: web_payload_manager
description: "Flutter package for versioned web payload updates, validation, and local WebView hosting."
version: 0.1.0
homepage: https://github.com/jixiaoyong/web_payload_manager
repository: https://github.com/jixiaoyong/web_payload_manager
issue_tracker: https://github.com/jixiaoyong/web_payload_manager/issues
topics:
  - webview
  - offline
  - hot-update
  - hybrid
  - local-server

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  path_provider: ^2.1.5
  crypto: ^3.0.5
  archive: ^4.7.1
  shared_preferences: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
